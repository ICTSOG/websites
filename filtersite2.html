      // Safe domain extractor helper
      const getDomain = (url) => {
        try {
          const parsed = new URL(url);
          return parsed.hostname.replace(/^www\./, '');
        } catch (e) {
          return url || '';
        }
      };

      // -------------------------------------------------------------
      // Component: TileScreenshotHeader
      // Renders real-time homepage screenshot header + fallback gradient
      // -------------------------------------------------------------
      function TileScreenshotHeader({ site, isFavorite, onToggleFavorite }) {
        const [imgLoaded, setImgLoaded] = useState(false);
        const [imgError, setImgError] = useState(false);

        const domain = getDomain(site.url);
        const screenshotUrl = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(site.url)}?w=600`;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=128`;

        // Generate consistent background gradient based on category name
        const getGradient = (catStr) => {
          const gradients = [
            'from-blue-500 to-indigo-600',
            'from-emerald-500 to-teal-700',
            'from-purple-500 to-pink-600',
            'from-amber-400 to-orange-600',
            'from-cyan-500 to-blue-700',
            'from-rose-500 to-red-600',
            'from-violet-500 to-purple-700',
            'from-teal-500 to-emerald-700'
          ];
          let hash = 0;
          for (let i = 0; i < catStr.length; i++) {
            hash = catStr.charCodeAt(i) + ((hash << 5) - hash);
          }
          const index = Math.abs(hash) % gradients.length;
          return gradients[index];
        };

        return (
          <div className="relative h-44 w-full overflow-hidden bg-slate-100 rounded-t-2xl group">
            {/* Fallback Display if image fails or is loading */}
            {(!imgLoaded || imgError) && (
              <div className={`absolute inset-0 bg-gradient-to-br ${getGradient(site.category)} flex flex-col items-center justify-center p-4 text-white text-center shadow-inner`}>
                <img 
                  src={faviconUrl} 
                  alt="" 
                  className="w-12 h-12 rounded-xl bg-white/90 p-2 shadow-md mb-2 object-contain"

      // -------------------------------------------------------------
      // Main EduKompas Application
      // -------------------------------------------------------------
      function App() {
        // State Initialization with LocalStorage Persistence
        const [sites, setSites] = useState(() => {
          try {
            const saved = localStorage.getItem("edukompas_sites_v3");
            return saved ? JSON.parse(saved) : INITIAL_SITES;
          } catch (e) {
            return INITIAL_SITES;
          }
        });

        // Filter & UI States
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedCategory, setSelectedCategory] = useState("Alle");
        const [selectedAge, setSelectedAge] = useState("Alle");
        const [minRating, setMinRating] = useState(0);
        const [showOnlyFavorites, setShowOnlyFavorites] = useState(false);
        const [sortBy, setSortBy] = useState("popular"); // popular, rating, az, newest
        
        // Admin & Modal States
        const [isAdmin, setIsAdmin] = useState(false);
        const [showAdminModal, setShowAdminModal] = useState(false);
        const [adminEmail, setAdminEmail] = useState("");
        const [adminPass, setAdminPass] = useState("");
        const [adminError, setAdminError] = useState("");

        const [showAddModal, setShowAddModal] = useState(false);
        const [editingSite, setEditingSite] = useState(null);
        const [showFirebaseModal, setShowFirebaseModal] = useState(false);

        // Mobile Filter Drawer State
        const [mobileFiltersOpen, setMobileFiltersOpen] = useState(false);

        // Site Form Data for Add/Edit
        const [formData, setFormData] = useState({
          title: "",
          url: "",
          category: CATEGORIES[0],
          description: "",
          ageRange: "Alle leeftijden",
          rating: 4.5,
          tags: ""
        });

        // Save Sites to LocalStorage
        useEffect(() => {
          try {
            localStorage.setItem("edukompas_sites_v3", JSON.stringify(sites));
          } catch (e) {
            console.error("Fout bij opslaan in localStorage", e);
          }
        }, [sites]);

        // Toggle Favorite
        const handleToggleFavorite = (id) => {
          setSites(prev => prev.map(s => s.id === id ? { ...s, isFavorite: !s.isFavorite } : s));
        };

        // Upvote Site
        const handleUpvote = (id) => {
          setSites(prev => prev.map(s => s.id === id ? { ...s, votes: (s.votes || 0) + 1 } : s));
        };

        // Rate Site
        const handleRate = (id, newRating) => {
          setSites(prev => prev.map(s => {
            if (s.id === id) {
              const updated = ((s.rating * 4) + newRating) / 5; // Blend rating
              return { ...s, rating: Math.round(updated * 10) / 10 };
            }
            return s;
          }));
        };

        // Admin Login
        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminEmail === "admin@school.be" && adminPass === "admin123") {
            setIsAdmin(true);
            setShowAdminModal(false);
            setAdminError("");
            setAdminPass("");
          } else {
            setAdminError("Ongeldige inloggegevens. Gebruik demo: admin@school.be / admin123");
          }
        };

        // Open Modal for Editing
        const handleOpenEdit = (site) => {
          setEditingSite(site);
          setFormData({
            title: site.title,
            url: site.url,
            category: site.category,
            description: site.description,
            ageRange: site.ageRange,
            rating: site.rating,
            tags: site.tags ? site.tags.join(", ") : ""
          });
          setShowAddModal(true);
        };

        // Open Modal for Adding
        const handleOpenAdd = () => {
          setEditingSite(null);
          setFormData({
            title: "",
            url: "",
            category: CATEGORIES[0],
            description: "",
            ageRange: "Alle leeftijden",
            rating: 4.5,
            tags: ""
          });
          setShowAddModal(true);
        };

        // Save Form (Add or Edit)
        const handleSaveSite = (e) => {
          e.preventDefault();
          if (!formData.title || !formData.url) return;

          const tagsArray = formData.tags.split(",").map(t => t.trim().toLowerCase()).filter(Boolean);

          if (editingSite) {
            setSites(prev => prev.map(s => s.id === editingSite.id ? {
              ...s,
              title: formData.title,
              url: formData.url,
              category: formData.category,
              description: formData.description,
              ageRange: formData.ageRange,
              rating: Number(formData.rating),
              tags: tagsArray
            } : s));
          } else {
            const newSite = {
              id: "site_" + Date.now(),
              title: formData.title,
              url: formData.url,
              category: formData.category,
              description: formData.description,
              ageRange: formData.ageRange,
              rating: Number(formData.rating),
              votes: 1,
              tags: tagsArray,
              isFavorite: false
            };
            setSites(prev => [newSite, ...prev]);
          }
          setShowAddModal(false);
        };

        // Delete Site
        const handleDeleteSite = (id) => {
          if (window.confirm("Weet je zeker dat je deze tegel wilt verwijderen?")) {
            setSites(prev => prev.filter(s => s.id !== id));
          }
        };

        // Reset Data to Default
        const handleResetDataset = () => {
          if (window.confirm("Herstel de standaard dataset met 100+ websites?")) {
            setSites(INITIAL_SITES);
            localStorage.removeItem("edukompas_sites_v3");
          }
        };

        // Category Counts map
        const categoryCounts = useMemo(() => {
          const counts = {};
          CATEGORIES.forEach(c => counts[c] = 0);
          sites.forEach(s => {
            if (counts[s.category] !== undefined) {
              counts[s.category]++;
            }
          });
          return counts;
        }, [sites]);

        // Filter and Sort Logic
        const filteredSites = useMemo(() => {
          return sites.filter(site => {
            // Search query filter
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              const matchTitle = site.title.toLowerCase().includes(q);
              const matchDesc = site.description.toLowerCase().includes(q);
              const matchUrl = site.url.toLowerCase().includes(q);
              const matchTags = site.tags && site.tags.some(t => t.toLowerCase().includes(q));
              if (!matchTitle && !matchDesc && !matchUrl && !matchTags) return false;
            }

            // Category filter
            if (selectedCategory !== "Alle" && site.category !== selectedCategory) {
              return false;
            }

            // Age filter
            if (selectedAge !== "Alle" && site.ageRange !== selectedAge && site.ageRange !== "Alle leeftijden") {
              return false;
            }

            // Min Rating filter
            if (minRating > 0 && site.rating < minRating) {
              return false;
            }

            // Favorites filter
            if (showOnlyFavorites && !site.isFavorite) {
              return false;
            }

            return true;
          }).sort((a, b) => {
            if (sortBy === "popular") return (b.votes || 0) - (a.votes || 0);
            if (sortBy === "rating") return b.rating - a.rating;
            if (sortBy === "az") return a.title.localeCompare(b.title);
            if (sortBy === "newest") return b.id.localeCompare(a.id);
            return 0;
          });
        }, [sites, searchQuery, selectedCategory, selectedAge, minRating, showOnlyFavorites, sortBy]);

        return (
          <div className="flex-1 flex flex-col min-h-screen">
            {/* Header / Navbar */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
                {/* Brand Logo */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i className="fa-solid fa-compass text-xl animate-spin-slow"></i>
                  </div>
                  <div>
                    <h1 className="font-fredoka font-bold text-2xl text-slate-800 leading-tight">
                      Edu<span className="text-emerald-600">Kompas</span>
                    </h1>
                    <p className="text-[11px] text-slate-500 font-semibold hidden sm:block">
                      Het Kindvriendelijke Schoolportaal
                    </p>
                  </div>
                </div>

                {/* Top Search Bar */}
                <div className="flex-1 max-w-xl mx-2">
                  <div className="relative">
                    <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input
                      type="text"
                      placeholder="Zoek op naam, onderwerp, tag of url..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-10 pr-10 py-2 bg-slate-100 hover:bg-slate-200/70 focus:bg-white text-slate-800 text-sm rounded-xl border border-transparent focus:border-emerald-500 focus:outline-none transition-all shadow-inner"
                    />
                    {searchQuery && (
                      <button 
                        onClick={() => setSearchQuery("")}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm"
                      >
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    )}
                  </div>
                </div>

                {/* Admin Mode Controls & Buttons */}
                <div className="flex items-center gap-2">
                  {isAdmin ? (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={handleOpenAdd}
                        className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition-all flex items-center gap-1.5"
                      >
                        <i className="fa-solid fa-plus"></i>
                        <span className="hidden md:inline">Website Toevoegen</span>
                      </button>

                      <button
                        onClick={() => setIsAdmin(false)}
                        className="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors"
                        title="Uitloggen Admin"
                      >
                        <i className="fa-solid fa-right-from-bracket"></i>
                      </button>
                    </div>
                  ) : (
                    <button
                      onClick={() => setShowAdminModal(true)}
                      className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs sm:text-sm rounded-xl transition-colors flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-lock text-slate-400"></i>
                      <span>Beheer Login</span>
                    </button>

                  {/* Mobile Filters Toggle Button */}
                  <button
                    onClick={() => setMobileFiltersOpen(!mobileFiltersOpen)}
                    className="lg:hidden p-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200"
                    title="Filters"

                    <i className="fa-solid fa-sliders"></i>

              </div>

            {/* Quick Stats Hero Banner */}

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                  <h2 className="font-fredoka font-bold text-2xl sm:text-3xl text-white">

                  </p>
                </div>

                <div className="flex items-center gap-3 sm:gap-6 bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/20 text-center">
                  <div>
                    <span className="font-fredoka font-bold text-xl sm:text-2xl text-white block">{sites.length}</span>
                    <span className="text-[10px] text-emerald-100 uppercase tracking-wider font-semibold">Websites</span>
                  </div>
                  <div className="h-8 w-px bg-white/20"></div>
                  <div>
                    <span className="font-fredoka font-bold text-xl sm:text-2xl text-white block">12</span>
                    <span className="text-[10px] text-emerald-100 uppercase tracking-wider font-semibold">Categorieën</span>

                      <i className={`fa-solid ${showOnlyFavorites ? 'fa-check text-rose-600' : 'fa-plus text-slate-400'}`}></i>
                    </button>

                    {/* Rating Selector */}
                    <div>
                      <label className="text-xs text-slate-500 font-semibold block mb-1">
                        Minimale beoordeling: {minRating > 0 ? `${minRating}+ Sterren` : 'Alle ratings'}
                      </label>
                      <div className="flex items-center gap-1">
                        {[0, 3, 4, 4.5].map((stars) => (
                          <button
                            key={stars}
                            onClick={() => setMinRating(stars)}
                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-colors ${
                              minRating === stars 
                                ? 'bg-amber-400 text-slate-900 shadow-sm' 
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            {stars === 0 ? 'Alle' : `${stars}★`}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <hr className="border-slate-100" />

                  {/* System & Data Actions */}
                  <div className="pt-1 space-y-2">
                    <button
                      onClick={handleResetDataset}
                      className="w-full py-2 px-3 text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-colors flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-rotate"></i>
                      <span>Herstel Standaard Dataset</span>
                    </button>

                    <button
                      onClick={() => setShowFirebaseModal(true)}
                      className="w-full py-2 px-3 text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 rounded-xl transition-colors flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-cloud"></i>
                      <span>Firebase Synchronisatie</span>
                    </button>
                  </div>

                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 flex flex-col min-w-0">
                
                {/* Controls Bar: Results Count & Sorting */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-2">
                    <span className="font-fredoka font-bold text-lg text-slate-800">
                      {filteredSites.length} {filteredSites.length === 1 ? 'Website' : 'Websites'}
                    </span>
                    {selectedCategory !== "Alle" && (
                      <span className="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full truncate max-w-[200px]">
                        {selectedCategory.replace(/^\d+\.\s*/, '')}
                      </span>
                    )}
                  </div>

                  {/* Sort Selector */}
                  <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <span className="text-xs text-slate-500 font-semibold whitespace-nowrap">Sorteer op:</span>
                    <select
                      value={sortBy}
                      onChange={(e) => setSortBy(e.target.value)}
                      className="bg-slate-100 text-slate-800 font-semibold text-xs px-3 py-2 rounded-xl border border-transparent focus:border-emerald-500 focus:outline-none cursor-pointer"
                    >
                      <option value="popular">Meest Populair (Stemmen)</option>
                      <option value="rating">Hoogste Beoordeling</option>
                      <option value="az">Alphabetisch (A-Z)</option>
                      <option value="newest">Nieuwst Toegevoegd</option>
                    </select>
                  </div>
                </div>

                {/* Tile Grid ("Tegels") */}
                {filteredSites.length > 0 ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredSites.map((site) => (
                      <WebsiteTile
                        key={site.id}
                        site={site}
                        onToggleFavorite={handleToggleFavorite}
                        onUpvote={handleUpvote}
                        onRate={handleRate}
                        onEdit={handleOpenEdit}
                        onDelete={handleDeleteSite}
                        isAdmin={isAdmin}
                      />
                    ))}
                  </div>
                ) : (
                  /* Empty State */
                  <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-12 text-center my-8">
                    <div className="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                      <i className="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <h3 className="font-fredoka font-bold text-xl text-slate-800">
                      Geen resultaten gevonden
                    </h3>
                    <p className="text-slate-500 text-sm mt-1 max-w-md mx-auto">
                      Er zijn geen websites die voldoen aan je huidige zoekopdracht of filterinstellingen.
                    </p>
                    <button
                      onClick={() => {
                        setSearchQuery("");
                        setSelectedCategory("Alle");
                        setSelectedAge("Alle");
                        setMinRating(0);
                        setShowOnlyFavorites(false);
                      }}
                      className="mt-4 px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl hover:bg-emerald-700 transition-colors"
                    >
                      Reset alle filters
                    </button>
                  </div>
                )}

              </main>
            </div>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500">
              <div className="max-w-7xl mx-auto px-4">
                <p className="font-semibold text-slate-600">
                  EduKompas © {new Date().getFullYear()} — Kindvriendelijk Schoolportaal met real-time tegels.
                </p>
                <p className="mt-1 text-[11px] text-slate-400">
                  Ontworpen voor basisscholen in Vlaanderen & Nederland • Integratie van 12 vakgebieden & screenshots.
                </p>
              </div>
            </footer>

            {/* ------------------------------------------------------------- */}
            {/* Modal: Admin Login */}
            {/* ------------------------------------------------------------- */}
            {showAdminModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2 text-emerald-600">
                      <i className="fa-solid fa-user-shield text-xl"></i>
                      <h3 className="font-fredoka font-bold text-xl text-slate-800">Beheer Login</h3>
                    </div>
                    <button 
                      onClick={() => setShowAdminModal(false)}
                      className="p-1 text-slate-400 hover:text-slate-600 text-lg"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  <form onSubmit={handleAdminLogin} className="space-y-4">
                    {adminError && (
                      <div className="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-semibold">
                        {adminError}
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">E-mailadres</label>
                      <input
                        type="email"
                        required
                        placeholder="admin@school.be"
                        value={adminEmail}
                        onChange={(e) => setAdminEmail(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Wachtwoord</label>
                      <input
                        type="password"
                        required
                        placeholder="••••••••"
                        value={adminPass}
                        onChange={(e) => setAdminPass(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      />
                    </div>

                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-[11px] text-slate-600 space-y-0.5">
                      <p className="font-bold text-slate-700">Demo Beheerder Gegevens:</p>
                      <p>• E-mail: <code className="text-emerald-700 font-bold">admin@school.be</code></p>
                      <p>• Wachtwoord: <code className="text-emerald-700 font-bold">admin123</code></p>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setShowAdminModal(false)}
                        className="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200"
                      >
                        Annuleren
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl hover:bg-emerald-700 shadow-md shadow-emerald-500/20"
                      >
                        Inloggen
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ------------------------------------------------------------- */}
            {/* Modal: Add / Edit Website */}
            {/* ------------------------------------------------------------- */}
            {showAddModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-fredoka font-bold text-xl text-slate-800">
                      {editingSite ? 'Website Bewerken' : 'Nieuwe Website Toevoegen'}
                    </h3>
                    <button 
                      onClick={() => setShowAddModal(false)}
                      className="p-1 text-slate-400 hover:text-slate-600 text-lg"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  <form onSubmit={handleSaveSite} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Website Titel</label>
                      <input
                        type="text"
                        required
                        placeholder="bijv. Canva for Education"
                        value={formData.title}
                        onChange={(e) => setFormData({...formData, title: e.target.value})}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Website URL</label>
                      <input
                        type="url"
                        required
                        placeholder="https://www.voorbeeld.be"
                        value={formData.url}
                        onChange={(e) => setFormData({...formData, url: e.target.value})}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      />
                      <p className="text-[10px] text-slate-400 mt-0.5">Real-time homepage screenshot wordt automatisch gegenereerd via de URL.</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Categorie (12 Vaste Categorieën)</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({...formData, category: e.target.value})}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      >
                        {CATEGORIES.map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Omschrijving</label>
                      <textarea
                        rows="3"
                        required
                        placeholder="Korte, heldere omschrijving van het leermiddel..."
                        value={formData.description}
                        onChange={(e) => setFormData({...formData, description: e.target.value})}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      ></textarea>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Doelgroep / Leeftijd</label>
                        <select
                          value={formData.ageRange}
                          onChange={(e) => setFormData({...formData, ageRange: e.target.value})}
                          className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                        >
                          {AGE_GROUPS.map(age => (
                            <option key={age} value={age}>{age}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Beoordeling (1-5)</label>
                        <input
                          type="number"
                          step="0.1"
                          min="1"
                          max="5"
                          value={formData.rating}
                          onChange={(e) => setFormData({...formData, rating: e.target.value})}
                          className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Tags (gescheiden door komma's)</label>
                      <input
                        type="text"
                        placeholder="mediawijsheid, games, vlaanderen"
                        value={formData.tags}
                        onChange={(e) => setFormData({...formData, tags: e.target.value})}
                        className="w-full px-3 py-2 bg-slate-100 rounded-xl text-sm border focus:bg-white focus:border-emerald-500 focus:outline-none"
                      />
                    </div>

                    <div className="flex gap-2 pt-3">
                      <button
                        type="button"
                        onClick={() => setShowAddModal(false)}
                        className="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200"
                      >
                        Annuleren
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl hover:bg-emerald-700 shadow-md shadow-emerald-500/20"
                      >
                        Opslaan
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ------------------------------------------------------------- */}
            {/* Modal: Firebase Firestore Configuration Setup */}
            {/* ------------------------------------------------------------- */}
            {showFirebaseModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2 text-emerald-600">
                      <i className="fa-solid fa-cloud-arrow-up text-xl"></i>
                      <h3 className="font-fredoka font-bold text-xl text-slate-800">Firebase Firestore Sync</h3>
                    </div>
                    <button 
                      onClick={() => setShowFirebaseModal(false)}
                      className="p-1 text-slate-400 hover:text-slate-600 text-lg"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  <p className="text-xs text-slate-600 leading-relaxed mb-4">
                    Momenteel worden alle wijzigingen, stemmen en nieuwe tegels automatisch lokaal opgeslagen via <code className="bg-slate-100 text-emerald-700 px-1 py-0.5 rounded font-mono">localStorage</code>.
                  </p>

                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 mb-4 text-xs text-slate-700">
                    <p className="font-bold">Live Cloud Koppeling:</p>
                    <p>Koppel je eigen Firebase Firestore project om stemmen en favorieten realtime te synchroniseren over alle klaslokaal-computers.</p>
                  </div>

                  <button
                    onClick={() => setShowFirebaseModal(false)}
                    className="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl hover:bg-emerald-700"
                  >
                    Begrepen
                  </button>
                </div>
              </div>
            )}

          </div>
        );
      }

      // Render Application to DOM
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
</body>
</html>
