<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Kookwebsite - Privé Recepten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F3EEE7;
      --border: #E8DFD5;
      --text-main: #2C2523;
      --text-muted: #7A6F6B;
      --primary: #C85A32;
      --primary-hover: #B04A25;
      --primary-light: #FDF1ED;
      --secondary: #5B7065;
      --accent: #E29578;
      --danger: #D9383A;
      --shadow-sm: 0 2px 8px rgba(44, 37, 35, 0.05);
      --shadow-md: 0 4px 16px rgba(44, 37, 35, 0.08);
      --shadow-lg: 0 10px 30px rgba(44, 37, 35, 0.12);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.25s ease;
    }

    [data-theme="dark"] {
      --bg-main: #181615;
      --bg-card: #23201E;
      --bg-subtle: #2D2926;
      --border: #3D3734;
      --text-main: #F5F2EF;
      --text-muted: #A89F9A;
      --primary: #E06D44;
      --primary-hover: #ED7E56;
      --primary-light: #34241E;
      --secondary: #789083;
      --accent: #E29578;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @media (min-width: 768px) {
      body {
        padding-bottom: 40px;
      }
    }

    /* HEADER & NAV */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .desktop-nav {
      display: none;
      gap: 0.5rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .desktop-nav {
        display: flex;
      }
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .nav-btn:hover {
      color: var(--text-main);
      background: var(--bg-subtle);
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .btn-add:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
